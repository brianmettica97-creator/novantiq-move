  <symbol id="utensils" viewBox="0 0 24 24"><path d="M5 3v6.5a2.5 2.5 0 0 0 5 0V3M7.5 12v9"/><path d="M18 21V3c-2.2 1.3-3.5 4-3.5 7.5S15.8 15 18 15"/></symbol>
